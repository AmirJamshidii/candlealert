<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CandleAlert Dashboard</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- DataTables + Bootstrap 5 theme -->
  <link href="https://cdn.datatables.net/2.0.7/css/dataTables.bootstrap5.min.css" rel="stylesheet" />

  <style>
    body { background: #0f1117; color: #e2e8f0; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .card-header { background: #1c2128; border-bottom: 1px solid #30363d; font-weight: 600; }
    .stat-value { font-size: 2rem; font-weight: 700; }
    /* Muted text on dark backgrounds (cards, navbar) */
    .text-muted { color: #8b949e !important; }
    table.dataTable thead { background: #1c2128; }
    table.dataTable thead th { color: #e2e8f0 !important; }
    .dataTables_wrapper .dataTables_filter input,
    .dataTables_wrapper .dataTables_length select {
      background: #0f1117; color: #e2e8f0; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px;
    }
    .dataTables_wrapper .dataTables_info,
    .dataTables_wrapper .dataTables_paginate { color: #8b949e; }
    .dataTables_wrapper .dataTables_paginate .paginate_button { color: #8b949e !important; }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #238636 !important; border-color: #238636 !important; color: #fff !important; border-radius: 4px; }
    .table { color: #e2e8f0; }
    .table > :not(caption) > * > * { background: transparent; color: #e2e8f0; border-bottom-color: #30363d; }
    .table-hover > tbody > tr:hover > * { background: #1c2128; }
    a { color: #58a6ff; } a:hover { color: #79c0ff; }
    .nav-tabs .nav-link { color: #8b949e; border: none; }
    .nav-tabs .nav-link.active { color: #e2e8f0; background: #161b22; border-bottom: 2px solid #238636; }
    .nav-tabs { border-bottom: 1px solid #30363d; }
    .badge-module { font-size: 0.75rem; }
    #refreshBadge { font-size: 0.75rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4 py-2">
  <span class="navbar-brand fw-bold"><i class="bi bi-activity text-success me-2"></i>CandleAlert Dashboard</span>
  <div class="d-flex align-items-center gap-3">
    <span id="healthBadge" class="badge bg-secondary">Checking...</span>
    <span id="refreshBadge" class="text-muted">Auto-refresh in <span id="countdown">60</span>s</span>
  </div>
</nav>

<div class="container-fluid py-4 px-4">

  <!-- Stat Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body text-center py-4">
          <div class="text-muted mb-1"><i class="bi bi-lightning-charge me-1"></i>Total Signals Fired</div>
          <div class="stat-value text-success" id="totalSignals">—</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body text-center py-4">
          <div class="text-muted mb-1"><i class="bi bi-clock-history me-1"></i>Active Intervals</div>
          <div id="activeIntervals" class="d-flex justify-content-center gap-2 mt-2 flex-wrap"></div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body text-center py-4">
          <div class="text-muted mb-1"><i class="bi bi-people me-1"></i>Tracked Wallets (30d)</div>
          <div class="stat-value text-info" id="trackedWallets">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts Row -->
  <div class="row g-3 mb-4">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header"><i class="bi bi-graph-up me-2 text-success"></i>Signal Timeline (last 30 days)</div>
        <div class="card-body"><canvas id="timelineChart" height="90"></canvas></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-header"><i class="bi bi-pie-chart me-2 text-warning"></i>Signals by Interval</div>
        <div class="card-body d-flex align-items-center justify-content-center" style="min-height:220px">
          <canvas id="intervalChart" style="max-height:200px"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="card">
    <div class="card-header p-0">
      <ul class="nav nav-tabs border-0 px-3 pt-2" id="dashTabs">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLeaderboard"><i class="bi bi-trophy me-1"></i>Wallet Leaderboard</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabAlerts"><i class="bi bi-bell me-1"></i>Recent Alerts</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabWinners"><i class="bi bi-bar-chart me-1"></i>Recent Winners</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabErrors"><i class="bi bi-exclamation-triangle me-1 text-warning"></i>Error Log</button></li>
      </ul>
    </div>
    <div class="card-body tab-content pt-3">

      <!-- Wallet Leaderboard -->
      <div class="tab-pane fade show active" id="tabLeaderboard">
        <table id="tblLeaderboard" class="table table-hover table-sm w-100">
          <thead><tr><th>#</th><th>Wallet</th><th>Signals</th><th>Total Shares</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Recent Alerts -->
      <div class="tab-pane fade" id="tabAlerts">
        <table id="tblAlerts" class="table table-hover table-sm w-100">
          <thead><tr><th>Time (UTC)</th><th>Interval</th><th>Signal Key</th><th>Chat ID</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Recent Winners -->
      <div class="tab-pane fade" id="tabWinners">
        <table id="tblWinners" class="table table-hover table-sm w-100">
          <thead><tr><th>Time (UTC)</th><th>Interval</th><th>Wallet</th><th>Shares</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Error Log -->
      <div class="tab-pane fade" id="tabErrors">
        <table id="tblErrors" class="table table-hover table-sm w-100">
          <thead><tr><th>Time (UTC)</th><th>Module</th><th>Message</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.7/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.0.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script>
const INTERVAL_COLORS = ['#238636','#1f6feb','#f78166','#d29922','#8957e5','#3fb950'];
const DT_OPTS = { pageLength: 10, order: [], language: { emptyTable: 'No data yet' } };

let timelineChart, intervalChart;
const dtInstances = {};

function abbrev(addr) {
  if (!addr || addr.length <= 12) return addr;
  return addr.slice(0, 6) + '...' + addr.slice(-4);
}

function profileLink(addr) {
  return `<a href="https://polymarket.com/profile/${addr}" target="_blank" rel="noopener">${abbrev(addr)}</a>`;
}

function fmtTime(ts) {
  const d = new Date(typeof ts === 'number' ? ts : ts);
  return d.toUTCString().replace(' GMT', ' UTC');
}

function fmtNum(n) {
  return parseFloat(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function initTable(id, opts) {
  if (dtInstances[id]) { dtInstances[id].destroy(); $(`#${id} tbody`).empty(); }
  dtInstances[id] = $(`#${id}`).DataTable({ ...DT_OPTS, ...opts });
  return dtInstances[id];
}

async function fetchJSON(url) {
  try { const r = await fetch(url); return r.ok ? r.json() : null; }
  catch { return null; }
}

async function loadHealth() {
  const data = await fetchJSON('/api/health');
  const el = document.getElementById('healthBadge');
  if (data?.status === 'ok') { el.className = 'badge bg-success'; el.textContent = 'Healthy'; }
  else { el.className = 'badge bg-danger'; el.textContent = 'Unhealthy'; }
}

async function loadConfig() {
  const data = await fetchJSON('/api/config');
  if (!data) return;
  const el = document.getElementById('activeIntervals');
  el.innerHTML = (data.intervals || []).map(i =>
    `<span class="badge bg-secondary fs-6 px-3">${i}</span>`
  ).join('');
}

async function loadSummary() {
  const data = await fetchJSON('/api/analytics/signals/summary');
  if (!data) return;
  const total = data.reduce((s, r) => s + Number(r.count), 0);
  document.getElementById('totalSignals').textContent = total.toLocaleString();

  const labels = data.map(r => r.interval);
  const counts = data.map(r => Number(r.count));
  const colors = labels.map((_, i) => INTERVAL_COLORS[i % INTERVAL_COLORS.length]);

  if (intervalChart) intervalChart.destroy();
  intervalChart = new Chart(document.getElementById('intervalChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: counts, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      plugins: { legend: { labels: { color: '#e2e8f0' } } },
      cutout: '60%',
    },
  });
}

async function loadTimeline() {
  const data = await fetchJSON('/api/analytics/signals/timeline?days=30');
  if (!data) return;
  const labels = data.map(r => r.date);
  const counts = data.map(r => Number(r.count));

  if (timelineChart) timelineChart.destroy();
  timelineChart = new Chart(document.getElementById('timelineChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Signals',
        data: counts,
        borderColor: '#238636',
        backgroundColor: 'rgba(35,134,54,0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
      }],
    },
    options: {
      scales: {
        x: { ticks: { color: '#8b949e', maxTicksLimit: 10 }, grid: { color: '#30363d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' }, beginAtZero: true },
      },
      plugins: { legend: { display: false } },
    },
  });
}

async function loadLeaderboard() {
  const data = await fetchJSON('/api/analytics/holders/leaderboard?days=30&limit=20');
  if (!data) return;
  document.getElementById('trackedWallets').textContent = data.length;
  const rows = data.map((r, i) => [
    i + 1,
    profileLink(r.walletAddress),
    r.signalCount,
    fmtNum(r.totalPosition),
  ]);
  const dt = initTable('tblLeaderboard', { columnDefs: [{ orderable: false, targets: 1 }] });
  rows.forEach(r => dt.row.add(r));
  dt.draw();
}

async function loadAlerts() {
  const data = await fetchJSON('/api/alerts?limit=50');
  if (!data) return;
  const rows = data.map(r => [
    fmtTime(Number(r.candleCloseTime)),
    `<span class="badge bg-secondary">${r.interval}</span>`,
    r.signalKey,
    r.chatId,
  ]);
  const dt = initTable('tblAlerts', {});
  rows.forEach(r => dt.row.add(r));
  dt.draw();
}

async function loadWinners() {
  const data = await fetchJSON('/api/winners?limit=100');
  if (!data) return;
  const rows = data.map(r => [
    fmtTime(new Date(r.createdAt)),
    `<span class="badge bg-secondary">${r.candleInterval}</span>`,
    profileLink(r.walletAddress),
    fmtNum(r.positionSize),
  ]);
  const dt = initTable('tblWinners', { columnDefs: [{ orderable: false, targets: 2 }] });
  rows.forEach(r => dt.row.add(r));
  dt.draw();
}

async function loadErrors() {
  const data = await fetchJSON('/api/analytics/errors');
  if (!data) return;
  const rows = data.map(r => [
    fmtTime(new Date(r.createdAt)),
    r.module ? `<span class="badge bg-warning text-dark badge-module">${r.module}</span>` : '—',
    `<span title="${(r.message || '').replace(/"/g, '&quot;')}">${(r.message || '').slice(0, 120)}${r.message?.length > 120 ? '…' : ''}</span>`,
  ]);
  const dt = initTable('tblErrors', { columnDefs: [{ orderable: false, targets: [1, 2] }] });
  rows.forEach(r => dt.row.add(r));
  dt.draw();
}

async function loadAll() {
  await Promise.all([
    loadHealth(),
    loadConfig(),
    loadSummary(),
    loadTimeline(),
    loadLeaderboard(),
    loadAlerts(),
    loadWinners(),
    loadErrors(),
  ]);
}

// Countdown + auto-refresh
let timer = 60;
setInterval(() => {
  timer--;
  document.getElementById('countdown').textContent = timer;
  if (timer <= 0) { timer = 60; loadAll(); }
}, 1000);

loadAll();
</script>
</body>
</html>
